<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fingerprint Verification</title>
  <!-- Restyle these styles to match your other pages. -->
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 4rem auto; padding: 0 1rem; text-align: center; }
    button { width: 100%; padding: .9rem; font-size: 1rem; cursor: pointer; }
    #msg { margin-top: 1rem; padding: .7rem; border-radius: 6px; min-height: 1.2rem; background: #f2f2f2; }
    .err { background: #fde2e2 !important; } .ok { background: #dff5e1 !important; }
  </style>
</head>
<body>
  <h2>Step 3 of 3: Fingerprint</h2>
  <p>Signing in as <strong>{{ username }}</strong></p>

  {% if has_credential %}
    <button id="go">Scan fingerprint</button>
  {% else %}
    <p>No fingerprint is enrolled for this account yet. Enrol this device's fingerprint reader to continue.</p>
    <button id="go">Enrol fingerprint</button>
  {% endif %}

  <div id="msg"></div>

  <script>
// Browser side of the WebAuthn fingerprint factor.
// WebAuthn uses binary buffers; our JSON API uses base64url strings.
const b64uToBuf = (s) => {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  s += "=".repeat((4 - (s.length % 4)) % 4);
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)).buffer;
};
const bufToB64u = (buf) =>
  btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function postJSON(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
    credentials: "same-origin",
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(data.error || "Request failed");
    err.data = data;
    throw err;
  }
  return data;
}

// Enrol this laptop's fingerprint reader for the current user.
async function registerFingerprint() {
  if (!window.PublicKeyCredential) {
    throw new Error("This browser does not support WebAuthn.");
  }
  const opts = await postJSON("/webauthn/register/options");
  opts.challenge = b64uToBuf(opts.challenge);
  opts.user.id = b64uToBuf(opts.user.id);
  (opts.excludeCredentials || []).forEach((c) => (c.id = b64uToBuf(c.id)));

  // Browser shows the Windows Hello / Touch ID prompt here.
  const cred = await navigator.credentials.create({ publicKey: opts });

  return postJSON("/webauthn/register/verify", {
    id: cred.id,
    rawId: bufToB64u(cred.rawId),
    type: cred.type,
    response: {
      clientDataJSON: bufToB64u(cred.response.clientDataJSON),
      attestationObject: bufToB64u(cred.response.attestationObject),
      transports: cred.response.getTransports ? cred.response.getTransports() : [],
    },
  });
}

// Prove presence of the enrolled fingerprint (login step 3).
async function loginWithFingerprint() {
  if (!window.PublicKeyCredential) {
    throw new Error("This browser does not support WebAuthn.");
  }
  const opts = await postJSON("/webauthn/login/options");
  opts.challenge = b64uToBuf(opts.challenge);
  (opts.allowCredentials || []).forEach((c) => (c.id = b64uToBuf(c.id)));

  const cred = await navigator.credentials.get({ publicKey: opts });

  return postJSON("/webauthn/login/verify", {
    id: cred.id,
    rawId: bufToB64u(cred.rawId),
    type: cred.type,
    response: {
      clientDataJSON: bufToB64u(cred.response.clientDataJSON),
      authenticatorData: bufToB64u(cred.response.authenticatorData),
      signature: bufToB64u(cred.response.signature),
      userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null,
    },
  });
}

  </script>
  <script>
    const msg = document.getElementById("msg");
    const hasCredential = {{ 'true' if has_credential else 'false' }};
    document.getElementById("go").onclick = async () => {
      msg.className = ""; msg.textContent = "Waiting for your fingerprint...";
      try {
        const res = hasCredential ? await loginWithFingerprint() : await registerFingerprint();
        msg.className = "ok"; msg.textContent = "Success";
        window.location = res.redirect;
      } catch (e) {
        msg.className = "err"; msg.textContent = e.message;
      }
    };
  </script>
</body>
</html>
