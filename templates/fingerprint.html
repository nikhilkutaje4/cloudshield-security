<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fingerprint · CloudShield</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e6edf7;font-family:system-ui,sans-serif}
  .card{width:min(92vw,380px);background:#121a2b;border:1px solid #243049;border-radius:16px;padding:32px;text-align:center}
  h1{font-size:1.25rem;margin:0 0 6px} p{color:#93a4c0;font-size:.9rem;margin:0 0 22px}
  .pad{width:120px;height:120px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;font-size:56px;
       background:#0f1626;border:2px solid #2f6fed;cursor:pointer;transition:.2s}
  .pad.scanning{animation:pulse 1s infinite;border-color:#22c55e}
  .pad.done{border-color:#22c55e;background:#10281c}
  @keyframes pulse{50%{box-shadow:0 0 0 14px rgba(34,197,94,.15)}}
  button{background:#2f6fed;color:#fff;border:0;border-radius:10px;padding:11px 22px;font-size:.95rem;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #msg{margin-top:16px;font-size:.9rem;min-height:1.2em} .ok{color:#22c55e}.err{color:#f87171}
  small{display:block;margin-top:18px;color:#6b7c99}
</style>
</head>
<body>
<div class="card" id="card" data-username="{{ username }}">
  <h1>Step 3 · Fingerprint</h1>
  <p>Hi {{ username }}. Scan your fingerprint to finish signing in.</p>
  <div class="pad" id="pad">🖐️</div>
  <button id="btn">Scan fingerprint</button>
  <div id="msg"></div>
  <small>Simulated biometric for demonstration. No real fingerprint is captured or stored.</small>
</div>
<script>
const USERNAME = document.getElementById('card').dataset.username;
const pad = document.getElementById('pad'), btn = document.getElementById('btn'), msg = document.getElementById('msg');

function say(text, cls){ msg.className = cls || ''; msg.textContent = text; }

async function enrolHere(){
  const res = await fetch('/fingerprint/enroll', {method:'POST', credentials:'same-origin'});
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Enrolment failed');
  try{ localStorage.setItem('cs_fp_' + USERNAME, data.template); }catch(e){}
  return data.template;
}

async function scan(){
  btn.disabled = true; pad.classList.add('scanning'); say('Scanning…');
  await new Promise(r => setTimeout(r, 1500));            // fake scan delay
  try{
    let template = null;
    try{ template = localStorage.getItem('cs_fp_' + USERNAME); }catch(e){}
    if(!template){                                         // no fingerprint stored on this device
      say('No fingerprint on this device. Enrolling it now…');
      template = await enrolHere();
    }
    const res = await fetch('/fingerprint/verify', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({template})
    });
    const data = await res.json();
    if(!res.ok){
      if(data.enrol){ template = await enrolHere(); return scan(); }
      throw new Error(data.error || 'Verification failed');
    }
    pad.classList.remove('scanning'); pad.classList.add('done'); pad.textContent='✅';
    say('Match ' + data.match_score + '% · Access granted', 'ok');
    setTimeout(() => location.href = data.redirect, 1200);
  }catch(e){
    pad.classList.remove('scanning'); btn.disabled = false; say(e.message, 'err');
  }
}
btn.onclick = pad.onclick = () => { if(!btn.disabled) scan(); };
</script>
</body>
</html>
