<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CloudShield · Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0f14; --panel: #0f1519; --panel-2: #131a20;
            --border: #1a2530; --border-light: #243040;
            --text: #c9d1d9; --text-dim: #8b949e; --text-mute: #4b5563;
            --green: #4ade80; --amber: #fbbf24; --red: #f87171;
            --cyan: #67e8f9;
            --mono: 'JetBrains Mono', 'Courier New', monospace;
            --sans: 'Inter', system-ui, sans-serif;
        }
        body {
            background: var(--bg); color: var(--text); font-family: var(--sans);
            min-height: 100vh; display: flex; justify-content: center;
            align-items: center; font-size: 13px;
            background-image:
                linear-gradient(rgba(74,222,128,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74,222,128,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .auth-container {
            width: 400px;
            background: var(--panel);
            border: 1px solid var(--border);
        }

        .auth-head {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel-2);
            display: flex; align-items: center; gap: 12px;
        }
        .auth-mark {
            width: 34px; height: 34px;
            background: var(--bg);
            border: 1px solid var(--green);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--mono); font-weight: 700;
            color: var(--green); font-size: 14px;
        }
        .auth-head .brand {
            font-family: var(--mono);
            font-size: 14px; font-weight: 700; color: var(--text);
            letter-spacing: 0.5px;
        }
        .auth-head .sub {
            font-family: var(--mono);
            font-size: 9px; color: var(--text-mute);
            letter-spacing: 1.5px; text-transform: uppercase;
            margin-top: 2px;
        }

        .status-bar {
            padding: 8px 20px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-mute);
            display: flex; justify-content: space-between;
        }
        .status-bar .ok { color: var(--green); }
        .status-bar .ok::before { content: '● '; }

        .auth-body { padding: 24px 20px; }

        .term-line {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text);
            margin-bottom: 20px;
        }
        .term-line .prompt { color: var(--green); margin-right: 6px; }
        .term-line .flash-cursor {
            display: inline-block; width: 6px; height: 12px;
            background: var(--green); animation: blink 1s infinite;
            vertical-align: middle; margin-left: 3px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .alert {
            padding: 10px 12px;
            font-family: var(--mono);
            font-size: 11px;
            margin-bottom: 16px;
            border-left: 2px solid;
        }
        .alert-danger {
            color: var(--red);
            border-color: var(--red);
            background: rgba(248,113,113,0.05);
        }
        .alert-danger::before { content: '[!] '; }
        .alert-success {
            color: var(--green);
            border-color: var(--green);
            background: rgba(74,222,128,0.05);
        }
        .alert-success::before { content: '[✓] '; }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-mute);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .form-group label::before { content: '> '; color: var(--green); }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--border-light);
            color: var(--text);
            font-family: var(--mono);
            font-size: 13px;
            outline: none;
        }
        .form-group input:focus { border-color: var(--green); }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background: var(--bg);
            color: var(--green);
            border: 1px solid var(--green);
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 8px;
        }
        .btn-submit:hover { background: var(--green); color: var(--bg); }

        .auth-foot {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            background: var(--panel-2);
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-mute);
            text-align: center;
        }
        .auth-foot a { color: var(--cyan); text-decoration: none; }
        .auth-foot a:hover { color: var(--green); }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-head">
        <div class="auth-mark">CS</div>
        <div>
            <div class="brand">CLOUDSHIELD</div>
            <div class="sub">SOC AUTHENTICATION</div>
        </div>
    </div>

    <div class="status-bar">
        <span class="ok">SYSTEM READY</span>
        <span>LAYER 1/3</span>
    </div>

    <div class="auth-body">
        <div class="term-line">
            <span class="prompt">$</span>authenticate --user<span class="flash-cursor"></span>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>username</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">[ AUTHENTICATE ]</button>
        </form>
    </div>

    <div class="auth-foot">
        no account? <a href="{{ url_for('register') }}">register →</a>
    </div>
</div>

</body>
</html>
